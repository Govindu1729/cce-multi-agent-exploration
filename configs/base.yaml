# Base configuration for CCE experiments

defaults:
  - _self_

seed: 0
num_envs: 64
num_updates: 1000
log_interval: 1
save_interval: 50
run_dir: "runs/default"
use_wandb: true
run_name: null

# Environment
grid_size: 20
num_agents: 4
fov_size: 5
obstacle_density: 0.2
max_steps: 128
comm_range: 3

# Model
backbone: "mlp"
actor_hidden: 64
critic_hidden: 256
gru_hidden: 128
n_codes: 16
code_dim: 8
n_slots: 4
budget_mode: "policy"
critic_type: "cnn"

# Training
lr_actor: 3.0e-4
lr_critic: 1.0e-3
gamma: 0.99
gae_lambda: 0.95
clip_eps: 0.2
entropy_coef: 0.01
batch_size: 3200
num_epochs: 10

# Communication budget (primary sweep variable)
beta: 0.25
