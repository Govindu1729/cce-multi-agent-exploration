# Smoke test: fast run to verify everything works

defaults:
  - base
  - _self_

seed: 0
num_envs: 16
num_updates: 20
log_interval: 1
save_interval: 100
run_dir: "runs/smoke"
run_name: "smoke_test"

# Small environment
grid_size: 10
num_agents: 2
fov_size: 3
max_steps: 32

# Smaller model
actor_hidden: 32
critic_hidden: 64
n_codes: 8
code_dim: 4
n_slots: 2
batch_size: 1600
num_epochs: 5

# Low budget
beta: 0.5
