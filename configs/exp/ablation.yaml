# Ablation study: disable communication components

defaults:
  - base
  - _self_

num_envs: 64
num_updates: 500
run_dir: "runs/ablation"

grid_size: 20
num_agents: 4
fov_size: 5
max_steps: 128
beta: 0.25

# Ablation variants (controlled via CLI overrides):
# 1. No communication: beta=0
# 2. No budget control: budget_mode=utility with very high threshold
# 3. No VQ: direct continuous communication (requires code change)
# 4. No GRU memory: backbone=mlp
